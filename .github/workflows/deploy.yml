name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test the Connect 4 engine
        run: npm test

      # A repo named <user>.github.io is served from "/", any other repo from
      # "/<repo-name>/". This picks the right one so links work in both.
      - name: Build
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then
            export PATH_PREFIX="/"
          else
            export PATH_PREFIX="/$REPO/"
          fi
          echo "PATH_PREFIX=$PATH_PREFIX" >> "$GITHUB_ENV"
          echo "Building with PATH_PREFIX=$PATH_PREFIX"
          npm run build

      - name: Check built site
        run: npm run check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
